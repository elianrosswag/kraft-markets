; KRAFT desk display: ESP32 "Cheap Yellow Display", 2-USB version (ST7789 + XPT2046 touch)
; Built automatically by .github/workflows/build-cyd.yml; you never need to install this locally.

[env:cyd2usb]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv ; 3 MB app space, no over-the-air updates
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  ricmoo/QRCode@0.0.1
build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; ── TFT_eSPI configuration (instead of editing User_Setup.h) ──
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2                          ; strapping pin: fine as a display output
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1                   ; display on HSPI, touch on VSPI
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT7=1
